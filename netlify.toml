[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  [build.environment]
    SECRETS_SCAN_OMIT_PATHS = "env.local,api/ai.js,api/engage.js,api/opps.js,api/social.js"

[functions]
  node_bundler = "esbuild"

# ── Auto-Opportunity Lifecycle scheduled functions ───────────────────────────
[functions."cleanup-opportunity-pages"]
  schedule = "0 2 * * *"   # Daily at 2 AM UTC — Requirement 2.1


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
